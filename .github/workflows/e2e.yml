name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧰 Prepare E2E configuration
        run: |
          cp .env.example .env.development
          cp google-services.json.example google-services.json

      - name: 🔧 Set up Expo project
        uses: ./.github/actions/setup-expo-project
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dev-env dependencies
        run: pnpm --dir dev-env install --frozen-lockfile

      - name: 📦 Install e2e suite dependencies
        run: pnpm --dir __e2e__ install --frozen-lockfile

      - name: 🌐 Install Chromium
        run: pnpm --dir __e2e__ exec playwright install --with-deps chromium

      - name: 🧪 Run the e2e suite
        # e2e.config.ts starts the mock network (dev-env) and the web dev server itself
        run: pnpm --dir __e2e__ test
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: 📤 Upload e2e report and artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-web
          path: |
            __e2e__/.e2e/report.json
            __e2e__/.e2e/artifacts
            __e2e__/.e2e/logs
          if-no-files-found: ignore
          retention-days: 14
