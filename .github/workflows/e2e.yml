name: E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web E2E
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧰 Prepare E2E configuration
        run: |
          cp .env.example .env.development
          cp google-services.json.example google-services.json

      - name: 🔧 Set up Expo project
        uses: ./.github/actions/setup-expo-project
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dev-env dependencies
        run: pnpm --dir dev-env install --frozen-lockfile

      - name: 📦 Install e2e suite dependencies
        run: pnpm --dir __e2e__ install --frozen-lockfile

      - name: 🌐 Install Chromium
        run: pnpm --dir __e2e__ exec playwright install --with-deps chromium

      - name: 🧪 Run the e2e suite
        # e2e.config.ts starts the mock network (dev-env) and the web dev server itself
        run: pnpm --dir __e2e__ test
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: 📤 Upload e2e report and artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-web
          path: |
            __e2e__/.e2e/report.json
            __e2e__/.e2e/artifacts
            __e2e__/.e2e/logs
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: iOS E2E (${{ matrix.shard }}/3)
    # a simulator build takes most of an hour, so this runs nightly and on demand;
    # the suite is split across three runners because one simulator runs it serially
    if: github.event_name != 'pull_request'
    runs-on: macos-26-xlarge
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.4'

      - name: 🧰 Prepare E2E configuration
        run: |
          cp .env.example .env.development
          cp google-services.json.example google-services.json

      - name: 🔧 Set up Expo project
        uses: ./.github/actions/setup-expo-project
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dev-env dependencies
        run: pnpm --dir dev-env install --frozen-lockfile

      - name: 📦 Install e2e suite dependencies
        run: pnpm --dir __e2e__ install --frozen-lockfile

      - name: 🐘 Start Postgres and Redis
        # the mock network expects Postgres on :5433 (user pg) and Redis on :6380
        run: |
          brew install redis
          postgres_bin="$(brew --prefix postgresql@14)/bin"
          postgres_data="$RUNNER_TEMP/e2e-postgres"
          "$postgres_bin/initdb" -D "$postgres_data" --auth=trust --username=pg --no-locale
          "$postgres_bin/pg_ctl" -D "$postgres_data" -o "-p 5433 -h 127.0.0.1" -l "$RUNNER_TEMP/postgres.log" start
          redis-server --bind 127.0.0.1 --port 6380 --save "" --appendonly no --daemonize yes
          for i in $(seq 1 30); do "$postgres_bin/pg_isready" -h 127.0.0.1 -p 5433 && break; sleep 1; done

      - name: 📱 Boot an iOS simulator
        run: |
          device_name="iPhone 17"
          udid=$(xcrun simctl list devices available --json | jq -r \
            --arg name "$device_name" \
            '[.devices[][] | select(.name == $name)] | first | .udid // empty')
          if [ -z "$udid" ]; then
            echo "The $device_name simulator is not installed" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "E2E_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # the "Save Password?" sheet stalls the runner; the keyboard's prediction bar makes its accessibility tree heavy
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences AutoFillPasswords -bool false
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences KeyboardPrediction -bool false
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences KeyboardAutocorrection -bool false

      - name: 🏗️ Build the iOS development client
        uses: ./.github/actions/eas-local-build
        with:
          platform: ios
          profile: e2e
          output: ${{ runner.temp }}/e2e-ios.tar.gz

      - name: 📲 Unpack the iOS development client
        run: |
          build_contents="$RUNNER_TEMP/e2e-ios-build"
          mkdir -p "$build_contents"
          tar -xzf "$RUNNER_TEMP/e2e-ios.tar.gz" -C "$build_contents"
          app_path=$(find "$build_contents" -type d -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "The local EAS build did not contain an iOS simulator app" >&2
            exit 1
          fi
          echo "E2E_IOS_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: 🧪 Run the e2e suite on iOS
        # e2e.config.ts installs E2E_IOS_APP_PATH, starts the mock network and Metro itself
        run: pnpm --dir __e2e__ test:ios --shard ${{ matrix.shard }}/3
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: 📤 Upload e2e report and artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios-${{ matrix.shard }}
          path: |
            __e2e__/.e2e/report.json
            __e2e__/.e2e/artifacts
            __e2e__/.e2e/logs
          if-no-files-found: ignore
          retention-days: 14
